name: Sales QA Bot

on:
  schedule:
    # every 10 minutes (GitHub cron granularity; actual lag can be 5-15 min during peak)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # allow manual "Run workflow" button

concurrency:
  group: sales-qa-bot
  cancel-in-progress: false

# Needed by the heartbeat step, which commits a daily timestamp so the repo
# stays "active" and GitHub never auto-disables this scheduled workflow again
# (it was disabled 2026-06-26 after 60 days of no commits, silently killing the
# QA bot).
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sales_qa_bot.py

      - name: Heartbeat (keep the schedule alive)
        if: always()
        run: |
          mkdir -p .github
          date -u +%Y-%m-%d > .github/heartbeat
          if ! git diff --quiet .github/heartbeat; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add .github/heartbeat
            git commit -m "chore: heartbeat [skip ci]"
            git push
          fi
