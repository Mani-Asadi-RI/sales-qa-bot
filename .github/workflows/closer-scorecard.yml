name: Weekly Closer Scorecard

on:
  schedule:
    # Mondays 12:00 UTC = 8:00 AM EDT (7:00 AM EST in winter)
    - cron: "0 12 * * 1"
  workflow_dispatch: {}  # allow manual "Run workflow" button

concurrency:
  group: closer-scorecard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post weekly scorecard
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python closer_scorecard_bot.py
