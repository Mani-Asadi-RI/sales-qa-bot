name: Daily Pipeline Hygiene

on:
  schedule:
    # Mon/Wed/Fri 12:00 UTC = 8:00 AM EDT — every other day per AJ's feedback
    # (sales meeting 2026-07-16); was daily.
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: {}  # allow manual "Run workflow" button

concurrency:
  group: pipeline-hygiene
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post daily hygiene list
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python pipeline_hygiene_bot.py
